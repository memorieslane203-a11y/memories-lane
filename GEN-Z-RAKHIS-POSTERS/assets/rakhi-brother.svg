<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb8ff"/>
      <stop offset=".5" stop-color="#3d6ef0"/>
      <stop offset="1" stop-color="#1c3a9e"/>
    </linearGradient>
    <linearGradient id="bSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset=".5" stop-color="#b9c6e8"/>
      <stop offset="1" stop-color="#7c8bb8"/>
    </linearGradient>
    <radialGradient id="bGem" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#9fd4ff"/>
      <stop offset=".55" stop-color="#2e6fe0"/>
      <stop offset="1" stop-color="#0d2f8e"/>
    </radialGradient>
    <filter id="bGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="x"/>
      <feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="146" fill="none" stroke="url(#bRing)" stroke-width="20" filter="url(#bGlow)"/>
  <circle cx="200" cy="200" r="146" fill="none" stroke="#9db8ff" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="round"/>
