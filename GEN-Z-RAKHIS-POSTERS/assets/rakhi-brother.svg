    <circle cx="238" cy="340" r="7.5" fill="url(#bGem)" stroke="#0d2f8e" stroke-width="1.5"/>
    <circle cx="162" cy="340" r="7.5" fill="url(#bGem)" stroke="#0d2f8e" stroke-width="1.5"/>
    <circle cx="274" cy="312" r="9" fill="url(#bSilver)"/>
