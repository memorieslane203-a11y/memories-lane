<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd0e8"/>
      <stop offset=".5" stop-color="#f76aa9"/>
      <stop offset="1" stop-color="#c0266f"/>
    </linearGradient>
    <linearGradient id="sRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffedcf"/>
      <stop offset=".5" stop-color="#f3c98a"/>
      <stop offset="1" stop-color="#c8944a"/>
    </linearGradient>
    <radialGradient id="sGem" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#ffb7dc"/>
      <stop offset=".55" stop-color="#f03e93"/>
      <stop offset="1" stop-color="#8e0f4e"/>
    </radialGradient>
    <filter id="sGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="x"/>
      <feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="146" fill="none" stroke="url(#sPink)" stroke-width="20" filter="url(#sGlow)"/>
  <circle cx="200" cy="200" r="146" fill="none" stroke="#ffcfea" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="round"/>
  <circle cx="200" cy="200" r="133" fill="none" stroke="url(#sRose)" stroke-width="4"/>

  <g>
    <circle cx="200" cy="352" r="10" fill="url(#sRose)" stroke="#b57b2e" stroke-width="2"/>
    <circle cx="238" cy="340" r="7.5" fill="url(#sGem)" stroke="#8e0f4e" stroke-width="1.5"/>
    <circle cx="162" cy="340" r="7.5" fill="url(#sGem)" stroke="#8e0f4e" stroke-width="1.5"/>
    <circle cx="274" cy="312" r="9" fill="url(#sRose)"/>
    <circle cx="126" cy="312" r="9" fill="url(#sRose)"/>
    <circle cx="304" cy="268" r="7" fill="url(#sGem)"/>
    <circle cx="96" cy="268" r="7" fill="url(#sGem)"/>
  </g>

  <g transform="translate(200,60)">
    <path d="M0 -60 C 40 -60, 62 -34, 60 4 C 58 34, 34 60, 0 60 C -34 60, -58 34, -60 4 C -62 -34, -40 -60, 0 -60 Z" fill="url(#sGem)" stroke="url(#sRose)" stroke-width="6"/>
    <path d="M0 -44 C 28 -44, 44 -24, 42 4 C 40 24, 24 44, 0 44 C -24 44, -40 24, -42 4 C -44 -24, -28 -44, 0 -44 Z" fill="url(#sRose)"/>
    <path d="M-14 -12 L0 -28 L14 -12 L30 2 L14 14 L0 30 L-14 14 L-30 2 Z" fill="#fff" opacity=".95"/>
    <circle r="8" fill="url(#sGem)"/>
  </g>

  <g>
    <path d="M66 128 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="url(#sRose)"/>
    <path d="M334 160 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="url(#sGem)"/>
    <circle cx="50" cy="200" r="5" fill="url(#sGem)"/>
    <circle cx="350" cy="280" r="5" fill="url(#sRose)"/>
  </g>
</svg>