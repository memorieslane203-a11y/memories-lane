<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf0b8"/>
      <stop offset=".35" stop-color="#f2cf6c"/>
      <stop offset=".62" stop-color="#d8a43a"/>
      <stop offset="1" stop-color="#91691d"/>
    </linearGradient>
    <linearGradient id="cGoldRev" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5a14"/>
      <stop offset=".5" stop-color="#e9c45a"/>
      <stop offset="1" stop-color="#fff4c9"/>
    </linearGradient>
    <radialGradient id="cRed" cx=".35" cy=".28" r=".95">
      <stop offset="0" stop-color="#ff8d7e"/>
      <stop offset=".5" stop-color="#d63a2e"/>
      <stop offset="1" stop-color="#6e120b"/>
    </radialGradient>
    <radialGradient id="cBead" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".5" stop-color="#eec760"/>
      <stop offset="1" stop-color="#a07a24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- trailing threads -->
  <path d="M60 250 C 40 300, 45 340, 62 372" fill="none" stroke="url(#cGold)" stroke-width="5" stroke-linecap="round"/>
  <path d="M340 250 C 360 300, 355 340, 338 372" fill="none" stroke="url(#cGold)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="62" cy="376" r="6" fill="url(#cRed)"/>
  <circle cx="338" cy="376" r="6" fill="url(#cRed)"/>
  <circle cx="70" cy="330" r="4.5" fill="url(#cBead)"/>
  <circle cx="330" cy="330" r="4.5" fill="url(#cBead)"/>

  <!-- ring band -->
  <circle cx="200" cy="200" r="142" fill="none" stroke="url(#cGold)" stroke-width="24"/>
  <circle cx="200" cy="200" r="142" fill="none" stroke="#fff3c0" stroke-width="3" opacity=".55" stroke-dasharray="1 14" stroke-linecap="round"/>
  <circle cx="200" cy="200" r="129" fill="none" stroke="url(#cGoldRev)" stroke-width="5"/>
  <circle cx="200" cy="200" r="155" fill="none" stroke="url(#cGoldRev)" stroke-width="3.5" opacity=".8"/>

  <!-- beads lower arc -->
  <g fill="url(#cBead)" stroke="#8a6419" stroke-width="1.5">
    <circle cx="200" cy="344" r="9"/>
    <circle cx="250" cy="334" r="7"/>
    <circle cx="294" cy="304" r="8.5"/>
    <circle cx="150" cy="334" r="7"/>
    <circle cx="106" cy="304" r="8.5"/>
    <circle cx="324" cy="256" r="6.5"/>
    <circle cx="76" cy="256" r="6.5"/>
    <circle cx="200" cy="344" r="9"/>
  </g>
  <g fill="url(#cRed)" stroke="#8a6419" stroke-width="1.5">
    <circle cx="224" cy="341" r="6.5"/>
    <circle cx="273" cy="322" r="6"/>
    <circle cx="176" cy="341" r="6.5"/>
    <circle cx="127" cy="322" r="6"/>
  </g>
  <g fill="#fff" opacity=".75">
    <circle cx="196" cy="340" r="2.6"/>
    <circle cx="246" cy="330" r="2.2"/>
    <circle cx="290" cy="300" r="2.4"/>
    <circle cx="146" cy="330" r="2.2"/>
    <circle cx="102" cy="300" r="2.4"/>
  </g>

  <!-- tassels -->
  <g stroke="url(#cGold)" stroke-width="3" stroke-linecap="round">
    <path d="M200 352 C 199 366, 200 372, 200 380"/>
    <path d="M191 348 C 187 360, 188 368, 187 376"/>
    <path d="M209 348 C 213 360, 212 368, 213 376"/>
  </g>
  <g fill="url(#cRed)">
    <circle cx="200" cy="384" r="5"/>
    <circle cx="187" cy="380" r="4"/>
    <circle cx="213" cy="380" r="4"/>
  </g>

  <!-- medallion -->
  <g transform="translate(200,62)">
    <circle r="56" fill="url(#cRed)" stroke="url(#cGold)" stroke-width="9"/>
    <circle r="41" fill="none" stroke="url(#cGold)" stroke-width="3"/>
    <circle r="29" fill="url(#cGold)"/>
    <circle r="15" fill="url(#cRed)"/>
    <circle r="7" fill="url(#cGold)"/>
    <g fill="url(#cGold)">
      <circle cx="0" cy="-34" r="4"/>
      <circle cx="24" cy="-24" r="3.4"/>
      <circle cx="24" cy="24" r="3.4"/>
      <circle cx="0" cy="34" r="4"/>
      <circle cx="-24" cy="-24" r="3.4"/>
      <circle cx="-24" cy="24" r="3.4"/>
    </g>
    <g fill="#fff" opacity=".6">
      <circle cx="-10" cy="-24" r="4.5"/>
      <circle cx="10" cy="-24" r="4.5"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="url(#cGold)">
    <path d="M64 96 l3.5 8 8 3.5 -8 3.5 -3.5 8 -3.5 -8 -8 -3.5 8 -3.5 z"/>
    <path d="M340 120 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z"/>
    <path d="M52 190 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" opacity=".9"/>
    <path d="M348 210 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" opacity=".9"/>
  </g>
</svg>